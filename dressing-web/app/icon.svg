<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="DRESSING">
  <title>DRESSING</title>
  <!-- Monogramme DR sous cintre — version plate, dessinée pour rester lisible
       à 16 px dans un onglet : traits épaissis, aucun dégradé, aucun relief.
       Les bras du cintre débordent volontairement des lettres, sinon la forme
       se lit comme une maison. Le rendu 3D doré sert aux grandes tailles
       (apple-icon, og:image). -->
  <g fill="none" stroke="#c9a84c" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- crochet -->
    <path d="M32 16.8v-5.4a4.3 4.3 0 1 0-4.3 4.3" />
    <!-- épaules + pointes relevées -->
    <path d="M5.6 28.9 8 30.6 32 16.9l24 13.7 2.4-1.7" />
    <!-- barre -->
    <path d="M6.6 30.6h50.8" />
  </g>
  <!-- lettres resserrées vers le centre pour dégager les bras du cintre -->
  <g transform="translate(3.2 0) scale(.9 1)">
    <!-- D -->
    <path fill="#c9a84c" fill-rule="evenodd"
          d="M12.5 30.2h11.8c7.4 0 12.2 5.6 12.2 13.6s-4.8 13.6-12.2 13.6H12.5V30.2Zm7.2 6.3v14.6h4c3.5 0 5.6-2.8 5.6-7.3s-2.1-7.3-5.6-7.3h-4Z" />
    <!-- R -->
    <path fill="#c9a84c" fill-rule="evenodd"
          d="M33.6 30.2h12.2c5.3 0 9 3.5 9 8.2 0 3.4-1.9 6.1-5 7.4l6.4 11.6h-8.2l-5.4-10.5h-1.8v10.5h-7.2V30.2Zm7.2 6.1v5h4.4c1.8 0 3-1 3-2.5s-1.2-2.5-3-2.5h-4.4Z" />
  </g>
</svg>
